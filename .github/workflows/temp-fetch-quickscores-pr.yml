name: Temporary QuickScores Fetch PR

on:
  pull_request:
    branches: [master]
    paths:
      - 'temp-quickscores-trigger.txt'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current schedules
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, time
          from urllib.parse import urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup

          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Cache-Control':'no-cache','Pragma':'no-cache'})
          BASE='https://www.quickscores.com'
          def fetch(url):
              sep='&' if '?' in url else '?'
              r=S.get(url+sep+'_cb='+str(time.time_ns()),timeout=45)
              print('FETCH',r.status_code,len(r.content),r.url)
              r.raise_for_status()
              return r.text
          def soup(url): return BeautifulSoup(fetch(url),'lxml')
          def alinks(sp,base):
              return [{'text':' '.join(a.get_text(' ',strip=True).split()),'href':urljoin(base,a.get('href'))}
                      for a in sp.find_all('a',href=True)]

          root=BASE+'/Orgs/Schedules.php?OrgDir=provo'
          rs=soup(root)
          links=[x for x in alinks(rs,root) if 'ResultsDisplay.php' in x['href']]
          print('LIVE_LINKS_JSON='+json.dumps(links))
          targets=[('Isak',['3rd','4th','Boys'],'DC United'),('Vera',['5th','6th','Girls'],'Lucky Charms'),('Levi',['Pre','K','East'],'Hornets')]
          out=[]
          for player,terms,team in targets:
              cs=[x for x in links if all(t.lower() in x['text'].lower().replace('-',' ') for t in terms)]
              print('CANDIDATES',player,json.dumps(cs))
              chosen=cs[0] if cs else None
              rec={'player':player,'team':team,'division':chosen}
              if not chosen: out.append(rec); continue
              ds=soup(chosen['href'])
              dhtml=str(ds)
              dlinks=alinks(ds,chosen['href'])
              rec['division_text']='\n'.join(x.strip() for x in ds.get_text('\n').splitlines() if x.strip())
              rec['division_links']=dlinks
              league=parse_qs(urlparse(chosen['href']).query).get('LeagueID',[None])[0]
              rec['league_id']=league
              tc=[x for x in dlinks if team.lower() in x['text'].lower()]
              rec['team_links']=tc
              tid=None
              for x in tc:
                  q=parse_qs(urlparse(x['href']).query)
                  if q.get('TeamID'): tid=q['TeamID'][0]; break
              if not tid:
                  # Locate TeamID in the nearest containing element around the exact team text.
                  node=ds.find(string=lambda z: z and team.lower() in z.lower())
                  if node:
                      parent=node.parent
                      for _ in range(8):
                          if parent is None: break
                          m=re.search(r'TeamID(?:=|%3D|[^0-9]{1,30})([0-9]{5,})',str(parent),re.I)
                          if m: tid=m.group(1); break
                          parent=parent.parent
              rec['team_id']=tid
              rec['pages']=[]
              if league and tid:
                  urls=[
                    f'{BASE}/Orgs/PrintSchedule.php?OrgDir=provo&LeagueID={league}&TeamID={tid}',
                    f'{BASE}/Orgs/ResultsDisplay.php?OrgDir=provo&LeagueID={league}&TeamID={tid}',
                    f'{BASE}/Orgs/DownloadSchedule.php?OrgDir=provo&LeagueID={league}&TeamID={tid}',
                  ]
                  for u in urls:
                      ps=soup(u)
                      tables=[]
                      for table in ps.find_all('table'):
                          rows=[]
                          for tr in table.find_all('tr'):
                              row=[' '.join(c.get_text(' ',strip=True).split()) for c in tr.find_all(['th','td'])]
                              if any(row): rows.append(row)
                          if rows: tables.append(rows)
                      rec['pages'].append({'url':u,'text':'\n'.join(x.strip() for x in ps.get_text('\n').splitlines() if x.strip()),'tables':tables,'links':alinks(ps,u)})
              out.append(rec)
          print('TARGET_RESULTS_JSON='+json.dumps(out))
          with open('quickscores-live.json','w') as f: json.dump({'links':links,'targets':out},f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quickscores-live
          path: quickscores-live.json
          retention-days: 1
