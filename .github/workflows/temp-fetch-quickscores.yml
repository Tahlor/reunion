name: Temporary QuickScores Fetch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-fetch-quickscores.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live Provo schedules and target teams
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, sys, time
          from urllib.parse import urljoin, urlparse, parse_qs
          import requests
          from bs4 import BeautifulSoup

          BASE = 'https://www.quickscores.com'
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache',
          })

          def get(url):
              sep = '&' if '?' in url else '?'
              live = f"{url}{sep}_cb={int(time.time()*1000)}"
              r = session.get(live, timeout=45)
              print(f'FETCH {r.status_code} {len(r.content)} {r.url}', file=sys.stderr)
              r.raise_for_status()
              return r.text

          def links(html, base):
              s = BeautifulSoup(html, 'lxml')
              out=[]
              for a in s.find_all('a', href=True):
                  text=' '.join(a.get_text(' ', strip=True).split())
                  href=urljoin(base,a['href'])
                  out.append({'text':text,'href':href})
              return out

          schedules_url = BASE + '/Orgs/Schedules.php?OrgDir=provo'
          html = get(schedules_url)
          all_links = links(html, schedules_url)
          schedule_links = [x for x in all_links if 'ResultsDisplay.php' in x['href']]
          print('=== LIVE SCHEDULE LINKS ===')
          print(json.dumps(schedule_links, indent=2))

          targets = [
              {'player':'Isak','division_terms':['3rd-4th','Boys'],'team':'DC United'},
              {'player':'Vera','division_terms':['5th-6th','Girls'],'team':'Lucky Charms'},
              {'player':'Levi','division_terms':['Pre-K','East'],'team':'Hornets'},
          ]
          results=[]
          for target in targets:
              candidates=[]
              for x in schedule_links:
                  norm=(x['text']+' '+x['href']).lower().replace('–','-').replace('—','-')
                  if all(t.lower() in norm for t in target['division_terms']):
                      candidates.append(x)
              print(f"=== CANDIDATES {target['player']} ===")
              print(json.dumps(candidates,indent=2))
              # Prefer a current Fall 2026 link if duplicate labels exist; live page ordering generally has current season first.
              if not candidates:
                  results.append({**target,'error':'division not found'})
                  continue
              div=candidates[0]
              div_html=get(div['href'])
              div_soup=BeautifulSoup(div_html,'lxml')
              div_text='\n'.join(line.strip() for line in div_soup.get_text('\n').splitlines() if line.strip())
              print(f"=== DIVISION TEXT {target['player']} BEGIN ===")
              print(div_text[:50000])
              print(f"=== DIVISION TEXT {target['player']} END ===")
              div_links=links(div_html,div['href'])
              team_candidates=[]
              for x in div_links:
                  if target['team'].lower() in x['text'].lower() or target['team'].lower() in x['href'].lower():
                      team_candidates.append(x)
              # Also inspect onclick/data attributes for team IDs.
              team_id_matches=[]
              for m in re.finditer(r'(?:TeamID|teamid)[^0-9]{0,20}([0-9]{5,})',div_html,re.I):
                  team_id_matches.append(m.group(1))
              print(f"=== TEAM LINKS {target['player']} ===")
              print(json.dumps(team_candidates,indent=2))
              print('TEAM_ID_MATCHES',sorted(set(team_id_matches)))

              league_id=parse_qs(urlparse(div['href']).query).get('LeagueID',[None])[0]
              team_id=None
              for x in team_candidates:
                  q=parse_qs(urlparse(x['href']).query)
                  if q.get('TeamID'):
                      team_id=q['TeamID'][0]; break
              # Search HTML near target team name for a TeamID if links did not expose it.
              if not team_id:
                  pattern=re.compile(re.escape(target['team'])+r'.{0,500}?(?:TeamID|teamid)[^0-9]{0,20}([0-9]{5,})',re.I|re.S)
                  m=pattern.search(div_html)
                  if m: team_id=m.group(1)
              if not team_id:
                  pattern=re.compile(r'(?:TeamID|teamid)[^0-9]{0,20}([0-9]{5,}).{0,500}?'+re.escape(target['team']),re.I|re.S)
                  m=pattern.search(div_html)
                  if m: team_id=m.group(1)

              team_urls=[]
              if league_id and team_id:
                  team_urls=[
                      f'{BASE}/Orgs/PrintSchedule.php?OrgDir=provo&LeagueID={league_id}&TeamID={team_id}',
                      f'{BASE}/Orgs/ResultsDisplay.php?OrgDir=provo&LeagueID={league_id}&TeamID={team_id}',
                      f'{BASE}/Orgs/DownloadSchedule.php?OrgDir=provo&LeagueID={league_id}&TeamID={team_id}',
                  ]
              pages=[]
              for u in team_urls:
                  th=get(u)
                  ts=BeautifulSoup(th,'lxml')
                  text='\n'.join(line.strip() for line in ts.get_text('\n').splitlines() if line.strip())
                  tables=[]
                  for ti,table in enumerate(ts.find_all('table')):
                      rows=[]
                      for tr in table.find_all('tr'):
                          cells=[' '.join(c.get_text(' ',strip=True).split()) for c in tr.find_all(['th','td'])]
                          if any(cells): rows.append(cells)
                      if rows: tables.append(rows)
                  page_links=links(th,u)
                  pages.append({'url':u,'text':text[:50000],'tables':tables,'links':page_links})
                  print(f'=== PAGE {u} BEGIN ===')
                  print(text[:50000])
                  print('=== TABLES ===')
                  print(json.dumps(tables,indent=2))
                  print('=== LINKS ===')
                  print(json.dumps(page_links,indent=2))
                  print(f'=== PAGE {u} END ===')
              results.append({**target,'division':div,'league_id':league_id,'team_id':team_id,'team_candidates':team_candidates,'pages':pages})

          with open('quickscores-live.json','w',encoding='utf-8') as f:
              json.dump({'schedule_links':schedule_links,'targets':results},f,indent=2)
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: quickscores-live
          path: quickscores-live.json
          retention-days: 1
